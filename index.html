<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>personal command search</title>
    <style type="text/css">
      body {
        max-width: 80em;
        margin: auto;
        font-size:  18px;
      }
    </style>
    <script src="command_search.js"></script>
  </head>
  <body>
    <div>
      <label for="searchCommand">Command:</label>
      <input type="text" id="searchCommand" name="searchCommand"/>
    </div>
    <div>
      <label for="searchDescription">Description:</label>
      <input type="text" id="searchDescription" name="searchDescription"/>
      <input type="checkbox" id="descriptionCaseSensitive" name="descriptionCaseSensitive"/>
      <label for="descriptionCaseSensitive">Case-sensitive</label>
    </div>
    <div id="output">
    </div>
  </body>
</html>
