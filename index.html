<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>personal command search</title>
    <link rel="stylesheet" href="styling.css">
    <script src="command-search.js"></script>
  </head>
  <body>
    <div>
      <label for="command" title="Search for matching command invocation">Command:</label>
      <input type="text" id="command" name="command" class="search"/>
      <input type="checkbox" id="commandRegex" name="commandRegex" class="search"/>
      <label for="commandRegex" title="Enable regular expression search"><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions">Regex</a></label>
    </div>
    <div>
      <label for="componentCommands" title="Commands making up the command invocation">Component commands:</label>
      <input type="text" id="componentCommands" name="componentCommands" class="search"/>
    </div>
    <div>
      <input type="checkbox" id="toggleDescription" class="search" checked />
      <label for="description">Description:</label>
      <input type="text" id="description" name="description" class="search"/>
      <input type="checkbox" id="descriptionCaseSensitive" name="descriptionCaseSensitive" class="search"/>
      <label for="descriptionCaseSensitive">Case-sensitive</label>
    </div>
    <div>
      <input type="checkbox" id="toggleExampleOutput" class="search"/>
      <label for="exampleOutput">Example output:</label>
      <input type="text" id="exampleOutput" name="Output" class="search"/>
      <input type="checkbox" id="exampleOutputCaseSensitive" name="exampleOutputCaseSensitive" class="search"/>
      <label for="exampleOutputCaseSensitive">Case-sensitive</label>
    </div>
    <div>
      <input type="checkbox" id="toggleLinks" class="search"/>
      <label for="links">Links:</label>
      <input type="text" id="links" name="links" class="search"/>
    </div>
    <div>
      <label>
      <input type="checkbox" id="toggleShell" class="search"/>
      Shell
      </label>
      <input type="button" class="search" id="allShells" value="All" />
      <input type="button" class="search" id="noShells"  value="None" />
    </div>
    <fieldset id="shellOptions" class="search">
      <legend>shell options:</legend>
    </fieldset>
    <div>
      <label>
      <input type="checkbox" id="toggleEdit" class="search"/>
      Edit commands
      </label>
    </div>
    <div>
      <input id="importJSON" type="file" multiple="false" class="IO" title="Import JSON file"/>
    </div>
    <div>
      <input type="button" id="exportJSON" class="IO" value="Export..."  title="Export JSON file"/>
    </div>
    <div>
      <button id="newCommandButton" popovertarget="newCommandDialog" title="Add a new command">New command...</button>
      <dialog id="newCommandDialog" popover>
        <form id="newCommandForm">
          <fieldset>
            <legend>Add a new command</legend>
            <div>
              <label for="shellInput" title="Shell">Shell:</label>
              <input id="newShell" type="text" name="shellInput" class="monospace" required />
            </div>
            <div>
              <label for="commandInput" title="Command invocation (what the shell runs)">Command:</label>
              <input id="newCommand" type="text" name="commandInput" class="monospace" required />
            </div>
            <div>
              <label for="componentCommandsInput" title="Space-delimited commands making up the command invocation">Component commands:</label>
              <input id="newComponentCommands" type="text" name="componentCommandsInput"class="monospace" required />
            </div>
            <div>
              <label for="descriptionInput">Description:</label>
              <textarea id="newDescription" name="descriptionInput" class="proportional" required></textarea>
            </div>
            <div>
              <label for="exampleOutputInput">Example output (optional):</label>
              <textarea id="newExampleOutput" name="exampleOutputInput" class="monospace"></textarea>
            </div>
            <div>
              <label for="linksInput" title="Links, one per line">Links (optional):</label>
              <textarea id="newLinks" name="linksInput" class="monospace"></textarea>
            </div>
            <div>
              <label for="uuidInput" title=Universally unique identifier>UUID (optional):</label>
              <input id="newUUID" type="text" name="uuidInput" class="monospace" />
            </div>
            <div>
              <button id="saveNewCommandButton" value="save" popovertarget="newCommandDialog" popovertargetaction="hide">Save</button>
              <button id="cancelNewCommandButton" value="cancel" popovertarget="newCommandDialog" popovertargetaction="hide">Cancel (don't save)</button>
            </div>
          </fieldset>
        </form>
      </dialog>
      <dialog id="editCommandDialog" popover>
        <form id="editCommandForm">
          <fieldset>
            <legend>Edit a command</legend>
            <div>
              <label for="shellInput" title="Shell">Shell:</label>
              <input id="editShell" type="text" name="shellInput" class="monospace" required />
            </div>
            <div>
              <label for="commandInput" title="Command invocation (what the shell runs)">Command:</label>
              <input id="editCommand" type="text" name="commandInput" class="monospace" required />
            </div>
            <div>
              <label for="componentCommandsInput" title="Space-delimited commands making up the command invocation">Component commands:</label>
              <input id="editComponentCommands" type="text" name="componentCommandsInput" class="monospace" required />
            </div>
            <div>
              <label for="descriptionInput">Description:</label>
              <textarea id="editDescription" name="descriptionInput" class="proportional" required></textarea>
            </div>
            <div>
              <label for="exampleOutputInput">Example output (optional):</label>
              <textarea id="editExampleOutput" name="exampleOutputInput" class="monospace"></textarea>
            </div>
            <div>
              <label for="linksInput" title="Links, one per line">Links (optional):</label>
              <textarea id="editLinks" name="linksInput" class="monospace"></textarea>
            </div>
            <div>
              <label for="uuidInput" title="Universally unique identifier">UUID (optional):</label>
              <input id="editUUID" type="text" name="uuidInput" class="monospace" />
            </div>
            <div>
              <button id="saveEditedCommandButton" value="save" popovertarget="editCommandDialog" popovertargetaction="hide">Save</button>
              <button id="cancelEditCommandButton" value="cancel" popovertarget="editCommandDialog" popovertargetaction="hide">Cancel (don't save)</button>
            </div>
          </fieldset>
        </form>
      </dialog>
    </div>
    <div id="output" class="search">
    </div>
  </body>
</html>
